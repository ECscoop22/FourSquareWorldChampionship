<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    h1, h2 {
      text-align: center;
    }
    form {
      max-width: 400px;
      margin: 20px auto;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }
    input, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    .game {
      border: 1px solid #ddd;
      margin: 10px auto;
      padding: 10px;
      border-radius: 5px;
      background: #fff;
      max-width: 600px;
    }
    .game strong {
      display: block;
      margin-bottom: 5px;
    }
    .actions {
      margin-top: 10px;
    }
    .actions button {
      width: auto;
      margin-right: 10px;
      padding: 5px 10px;
    }
    #clearAllBtn {
      display: none;
      background: #d9534f;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      margin: 20px auto;
      text-align: center;
    }
    #clearAllBtn:hover {
      background: #c9302c;
    }
  </style>
</head>
<body>
  <h1>GAME HUB</h1>

  <h2>Host a Game</h2>
  <form id="gameForm">
    <input type="text" id="hostName" placeholder="Your Name" required>
    <input type="email" id="hostEmail" placeholder="Your Email" required>
    <input type="text" id="location" placeholder="Location" required>
    <input type="date" id="date" required>
    <input type="time" id="time" required>
    <button type="submit">Create Game</button>
  </form>

  <h2>Upcoming Games</h2>
  <div id="gamesList"></div>

  <!-- Admin-only Clear All button -->
  <button id="clearAllBtn">Clear All Games</button>

  <script>
    const ADMIN_EMAIL = "ericcostanza@yahoo.com"; 
    let currentUserEmail = "";

    document.addEventListener("DOMContentLoaded", () => {
      loadGames();
    });

    document.getElementById("gameForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const hostName = document.getElementById("hostName").value;
      const hostEmail = document.getElementById("hostEmail").value;
      const location = document.getElementById("location").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;

      currentUserEmail = hostEmail;

      if (currentUserEmail === ADMIN_EMAIL) {
        document.getElementById("clearAllBtn").style.display = "block";
      }

      const game = {
        id: Date.now(),
        hostName,
        hostEmail,
        location,
        date,
        time,
        players: []
      };

      let games = JSON.parse(localStorage.getItem("games")) || [];
      games.push(game);
      localStorage.setItem("games", JSON.stringify(games));

      e.target.reset();
      loadGames();
    });

    function loadGames() {
      const gamesList = document.getElementById("gamesList");
      gamesList.innerHTML = "";

      let games = JSON.parse(localStorage.getItem("games")) || [];

      games.forEach(game => {
        const gameDiv = document.createElement("div");
        gameDiv.className = "game";

        const formattedDate = new Date(game.date).toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });

        let [hour, minute] = game.time.split(":");
        hour = parseInt(hour);
        const ampm = hour >= 12 ? "PM" : "AM";
        hour = hour % 12 || 12;
        const formattedTime = `${hour}:${minute} ${ampm}`;

        gameDiv.innerHTML = `
          <strong>Host:</strong> ${game.hostName} <br>
          <strong>Email:</strong> ${game.hostEmail} <br>
          <strong>Location:</strong> ${game.location} <br>
          <strong>Date:</strong> ${formattedDate} <br>
          <strong>Time:</strong> ${formattedTime} <br>
          <strong>Players Joined:</strong>
          <ul>${game.players.map(p => `<li>${p.name} (${p.email})</li>`).join("")}</ul>
        `;

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "actions";

        // Edit button (host or admin)
        if (currentUserEmail === game.hostEmail || currentUserEmail === ADMIN_EMAIL) {
          const editBtn = document.createElement("button");
          editBtn.textContent = "Edit";
          editBtn.onclick = () => editGame(game.id);
          actionsDiv.appendChild(editBtn);

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = () => deleteGame(game.id);
          actionsDiv.appendChild(deleteBtn);
        }

        // Join button
        const joinBtn = document.createElement("button");
        joinBtn.textContent = "Join";
        joinBtn.onclick = () => joinGame(game.id);
        actionsDiv.appendChild(joinBtn);

        gameDiv.appendChild(actionsDiv);
        gamesList.appendChild(gameDiv);
      });
    }

    function joinGame(id) {
      const name = prompt("Enter your first name:");
      const email = prompt("Enter your email:");

      if (!name || !email) return;

      let games = JSON.parse(localStorage.getItem("games")) || [];
      const game = games.find(g => g.id === id);

      if (game) {
        game.players.push({ name, email });
        localStorage.setItem("games", JSON.stringify(games));
        loadGames();
      }
    }

    function editGame(id) {
      let games = JSON.parse(localStorage.getItem("games")) || [];
      const game = games.find(g => g.id === id);

      if (game) {
        const newLocation = prompt("Enter new location:", game.location);
        const newDate = prompt("Enter new date (YYYY-MM-DD):", game.date);
        const newTime = prompt("Enter new time (HH:MM):", game.time);

        if (newLocation && newDate && newTime) {
          game.location = newLocation;
          game.date = newDate;
          game.time = newTime;

          localStorage.setItem("games", JSON.stringify(games));
          loadGames();
        }
      }
    }

    function deleteGame(id) {
      let games = JSON.parse(localStorage.getItem("games")) || [];
      games = games.filter(g => g.id !== id);
      localStorage.setItem("games", JSON.stringify(games));
      loadGames();
    }

    // Admin-only: Clear All Games
    document.getElementById("clearAllBtn").addEventListener("click", () => {
      if (confirm("Are you sure you want to delete ALL games? This cannot be undone.")) {
        localStorage.removeItem("games");
        loadGames();
      }
    });
  </script>
</body>
</html>
