<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ - Four Square World Championship</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Center titles */
    h1, h2 {
      text-align: center;
    }
    .game-card {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .btn-small {
      padding: 4px 8px;
      margin: 2px;
      font-size: 0.85em;
      cursor: pointer;
    }
    .join-list {
      margin-top: 8px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <!-- Header / Banner -->
  <header>
    <div class="banner">
      <h1>FOUR SQUARE</h1>
      <p>World Championship</p>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="rules.html">Rules</a>
      <a href="world-championship.html">World Championship</a>
      <a href="register.html">Register</a>
      <a href="faq.html" class="active">FAQ</a>
      <a href="prizes.html">Prizes</a>
      <a href="media.html">Media</a>
    </nav>
  </header>

  <main>
    <!-- Game Hub Section -->
    <section>
      <h1>Game Hub</h1>

      <h2>Host a Game</h2>
      <form id="gameForm">
        <label>Date: <input type="date" id="gameDate" required /></label><br />
        <label>Time: <input type="time" id="gameTime" required /></label><br />
        <label>Location: <input type="text" id="gameLocation" required /></label><br />
        <label>Your Name: <input type="text" id="hostName" required /></label><br />
        <label>Your Email: <input type="email" id="hostEmail" required /></label><br />
        <button type="submit">Submit</button>
      </form>

      <h2>Upcoming Games</h2>
      <div id="gamesList"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Four Square World Championship. All Rights Reserved.</p>
  </footer>

  <script>
    const adminEmail = "ericcostanza@yahoo.com";

    function loadGames() {
      const games = JSON.parse(localStorage.getItem("games")) || [];
      const gamesList = document.getElementById("gamesList");
      gamesList.innerHTML = "";

      games.forEach((game, index) => {
        const gameCard = document.createElement("div");
        gameCard.className = "game-card";

        const dateObj = new Date(game.date + "T" + game.time);
        const formattedDate = dateObj.toLocaleDateString("en-US", {
          month: "long",
          day: "numeric",
          year: "numeric",
        });
        const formattedTime = dateObj.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
        });

        gameCard.innerHTML = `
          <p><strong>Date:</strong> ${formattedDate}</p>
          <p><strong>Time:</strong> ${formattedTime}</p>
          <p><strong>Location:</strong> ${game.location}</p>
          <p><strong>Host:</strong> ${game.hostName}</p>
          <div class="join-list">
            <strong>Players Joined:</strong>
            <ul>
              ${game.players.map(player => `<li>${player.name} (${player.email})</li>`).join("")}
            </ul>
          </div>
        `;

        // Join button
        const joinBtn = document.createElement("button");
        joinBtn.textContent = "Join";
        joinBtn.className = "btn-small";
        joinBtn.onclick = () => {
          const name = prompt("Enter your first name:");
          const email = prompt("Enter your email:");
          if (name && email) {
            game.players.push({ name, email });
            localStorage.setItem("games", JSON.stringify(games));
            loadGames();
          }
        };
        gameCard.appendChild(joinBtn);

        // Edit button
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.className = "btn-small";
        editBtn.onclick = () => {
          const email = prompt("Enter your email to edit this game:");
          if (email === game.hostEmail || email === adminEmail) {
            const newDate = prompt("Enter new date (YYYY-MM-DD):", game.date);
            const newTime = prompt("Enter new time (HH:MM):", game.time);
            const newLocation = prompt("Enter new location:", game.location);
            if (newDate && newTime && newLocation) {
              game.date = newDate;
              game.time = newTime;
              game.location = newLocation;
              localStorage.setItem("games", JSON.stringify(games));
              loadGames();
            }
          } else {
            alert("You are not authorized to edit this game.");
          }
        };
        gameCard.appendChild(editBtn);

        // Delete button
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "btn-small";
        deleteBtn.onclick = () => {
          const email = prompt("Enter your email to delete this game:");
          if (email === game.hostEmail || email === adminEmail) {
            games.splice(index, 1);
            localStorage.setItem("games", JSON.stringify(games));
            loadGames();
          } else {
            alert("You are not authorized to delete this game.");
          }
        };
        gameCard.appendChild(deleteBtn);

        gamesList.appendChild(gameCard);
      });
    }

    document.getElementById("gameForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const game = {
        date: document.getElementById("gameDate").value,
        time: document.getElementById("gameTime").value,
        location: document.getElementById("gameLocation").value,
        hostName: document.getElementById("hostName").value,
        hostEmail: document.getElementById("hostEmail").value,
        players: [],
      };

      const games = JSON.parse(localStorage.getItem("games")) || [];
      games.push(game);
      localStorage.setItem("games", JSON.stringify(games));

      document.getElementById("gameForm").reset();
      loadGames();
    });

    loadGames();
  </script>
</body>
</html>
