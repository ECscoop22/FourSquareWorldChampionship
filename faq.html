<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .card { margin: 1em 0; padding: 1em; border-radius: 12px; background: #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    form input, form textarea { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 16px; margin-top: 8px; border: none; border-radius: 6px; cursor: pointer; background: #e63946; color: white; }
    button:hover { background: #c92f3f; }
    .join-btn { background: #457b9d; margin-left: 5px; }
    .join-btn:hover { background: #35607a; }
    .event { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 8px; }
    ul { margin: 5px 0 0 20px; padding: 0; }
    li { margin: 2px 0; }
  </style>
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a href="rules.html">Rules</a>
  <a href="world-championship.html">World Championship</a>
  <a href="register.html">Register</a>
  <a href="faq.html">Game Hub</a>
  <a href="blog.html">Blog</a>
  <a href="media.html">Media</a>
</nav>

<h1 class="glow-title" style="text-align:center;">GAME HUB</h1>

<!-- Post a Game Form -->
<section class="card">
  <h2>Host a Game</h2>
  <form id="gameForm">
    <input type="text" id="location" placeholder="Location (e.g., Dallas, TX)" required />
    <input type="date" id="date" required />
    <input type="time" id="time" required />
    <textarea id="details" placeholder="Extra details (optional)"></textarea>
    <button type="submit">Post Game</button>
  </form>
</section>

<!-- Event Listings -->
<section class="card">
  <h2>Upcoming Games</h2>
  <div id="gameList"></div>
</section>

<!-- Highlights -->
<section class="card">
  <h2>Game Highlights</h2>
  <form id="highlightForm">
    <textarea id="highlightText" placeholder="Share your summary, photos, or video link"></textarea>
    <button type="submit">Post Highlight</button>
  </form>
  <div id="highlightList"></div>
</section>

<footer>
  <p class="site-tagline">The nation's finest resource for all things four square.</p>
</footer>

<script>
  const adminEmail = "youremail@domain.com"; // set your admin email here

  const gameForm = document.getElementById("gameForm");
  const gameList = document.getElementById("gameList");
  const highlightForm = document.getElementById("highlightForm");
  const highlightList = document.getElementById("highlightList");

  let games = JSON.parse(localStorage.getItem("games")) || [];
  let highlights = JSON.parse(localStorage.getItem("highlights")) || [];

  function renderGames() {
    gameList.innerHTML = "";

    games.forEach((game, index) => {
      // Format time to 12-hour
      let [hour, minute] = game.time.split(":");
      hour = parseInt(hour);
      let ampm = hour >= 12 ? "PM" : "AM";
      hour = hour % 12 || 12;
      let formattedTime = hour + ":" + minute + " " + ampm;

      // Format date
      let dateObj = new Date(game.date);
      let options = { year: 'numeric', month: 'long', day: 'numeric' };
      let formattedDate = dateObj.toLocaleDateString(undefined, options);

      // Attendees list
      let attendeeList = "";
      if (Array.isArray(game.attendees) && game.attendees.length > 0) {
        attendeeList = "<ul>" + game.attendees.map(a => `<li>${a.name} (${a.email})</li>`).join("") + "</ul>";
      } else {
        attendeeList = "<p>No one joined yet</p>";
      }

      const div = document.createElement("div");
      div.classList.add("event");

      div.innerHTML = `
        <strong>${game.location}</strong> — ${formattedDate} at ${formattedTime}<br>
        ${game.details ? `<em>${game.details}</em><br>` : ""}
        <strong>Attendees:</strong> ${attendeeList}
        <button class="join-btn" onclick="joinGame(${index})">Join</button>
        <button class="join-btn" style="background:#f77;" onclick="editGame(${index})">Edit</button>
        <button class="join-btn" style="background:#c92f3f;" onclick="deleteGame(${index})">Delete</button>
      `;

      gameList.appendChild(div);
    });
  }

  // Add a new game
  gameForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const creatorName = prompt("Enter your first name:");
    if (!creatorName) return;
    const creatorEmail = prompt("Enter your email:");
    if (!creatorEmail) return;

    const newGame = {
      location: document.getElementById("location").value,
      date: document.getElementById("date").value,
      time: document.getElementById("time").value,
      details: document.getElementById("details").value,
      attendees: [],
      creator: { name: creatorName, email: creatorEmail }
    };

    games.push(newGame);
    localStorage.setItem("games", JSON.stringify(games));
    gameForm.reset();
    renderGames();
  });

  // Join a game
  function joinGame(index) {
    const name = prompt("Enter your first name:");
    if (!name) return;
    const email = prompt("Enter your email:");
    if (!email) return;

    games[index].attendees.push({ name, email });
    localStorage.setItem("games", JSON.stringify(games));
    renderGames();
  }

  // Delete game
  function deleteGame(index) {
    const email = prompt("Enter your email to confirm deletion:");
    if (!email) return;

    const game = games[index];
    if (game.creator.email === email || email === adminEmail) {
      if (confirm("Are you sure you want to delete this game?")) {
        games.splice(index, 1);
        localStorage.setItem("games", JSON.stringify(games));
        renderGames();
      }
    } else {
      alert("You are not authorized to delete this game.");
    }
  }

  // Edit game
  function editGame(index) {
    const email = prompt("Enter your email to edit this game:");
    if (!email) return;

    const game = games[index];
    if (game.creator.email === email || email === adminEmail) {
      const newLocation = prompt("Update location:", game.location);
      if (!newLocation) return;
      const newDate = prompt("Update date (YYYY-MM-DD):", game.date);
      if (!newDate) return;
      const newTime = prompt("Update time (HH:MM):", game.time);
      if (!newTime) return;
      const newDetails = prompt("Update details:", game.details);

      game.location = newLocation;
      game.date = newDate;
      game.time = newTime;
      game.details = newDetails;

      localStorage.setItem("games", JSON.stringify(games));
      renderGames();
    } else {
      alert("You are not authorized to edit this game.");
    }
  }

  // Render highlights
  function renderHighlights() {
    highlightList.innerHTML = "";
    highlights.forEach((text) => {
      const div = document.createElement("div");
      div.classList.add("highlight");
      div.innerText = text;
      highlightList.appendChild(div);
    });
  }

  // Add highlight
  highlightForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = document.getElementById("highlightText").value;
    if (text.trim() !== "") {
      highlights.push(text);
      localStorage.setItem("highlights", JSON.stringify(highlights));
      highlightForm.reset();
      renderHighlights();
    }
  });

  // Initialize
  renderGames();
  renderHighlights();
</script>
</body>
</html>
