<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Manager</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .event { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; border-radius: 8px; }
    .join-btn { margin: 5px 5px 0 0; padding: 5px 10px; cursor: pointer; border: none; border-radius: 6px; background: #007BFF; color: white; }
    .highlight-item { margin-top: 8px; padding: 5px; background: #f9f9f9; border-radius: 6px; }
    .highlight-item img { max-width: 200px; display: block; margin-top: 5px; border-radius: 6px; }
    
    /* Responsive video embed wrapper */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      max-width: 100%;
      border-radius: 6px;
      margin-top: 5px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Game Manager</h1>
  <div id="gameList"></div>

  <script>
    let games = JSON.parse(localStorage.getItem("games")) || [];
    const adminEmail = "admin@example.com"; // change if needed

    function renderGames() {
      const gameList = document.getElementById("gameList");
      gameList.innerHTML = "";
      games.forEach((game, index) => {
        const div = document.createElement("div");
        div.classList.add("event");

        const formattedDate = new Date(game.date).toLocaleDateString();
        const formattedTime = new Date(game.date).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});

        const attendeeList = game.attendees?.length
          ? game.attendees.map(a => a.name).join(", ")
          : "No one joined yet";

        const highlightsList = game.highlights?.length
          ? game.highlights.map(h => {
              let content = `<div class="highlight-item"><strong>${h.name}:</strong> ${h.text || ""}`;
              if (h.image) content += `<br><img src="${h.image}" alt="Highlight image" />`;
              if (h.video) {
                let videoEmbed = "";
                // ✅ Detect YouTube full + short
                if (h.video.includes("youtube.com") || h.video.includes("youtu.be")) {
                  let videoId = "";
                  if (h.video.includes("v=")) {
                    videoId = h.video.split("v=")[1]?.split("&")[0];
                  } else if (h.video.includes("youtu.be/")) {
                    videoId = h.video.split("youtu.be/")[1]?.split("?")[0];
                  }
                  if (videoId) {
                    videoEmbed = `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
                  }
                }
                // ✅ Detect Vimeo
                else if (h.video.includes("vimeo.com")) {
                  const videoId = h.video.split("/").pop();
                  videoEmbed = `<div class="video-wrapper"><iframe src="https://player.vimeo.com/video/${videoId}" allowfullscreen></iframe></div>`;
                }
                // Fallback: show as link
                else {
                  videoEmbed = `<br><a href="${h.video}" target="_blank">Watch Video</a>`;
                }
                content += videoEmbed;
              }
              return content + "</div>";
            }).join("")
          : "<em>No highlights yet</em>";

        div.innerHTML = `
          <strong>${game.location}</strong> — ${formattedDate} at ${formattedTime}<br>
          ${game.details ? `<em>${game.details}</em><br>` : ""}
          <strong>Attendees (${game.attendees.length}):</strong> ${attendeeList}<br><br>
          <strong>Highlights:</strong><br>${highlightsList}<br>
          <input type="text" id="highlightText${index}" placeholder="Add highlight text or video URL" /><br>
          <input type="file" id="highlightImage${index}" accept="image/*" /><br>
          <button class="join-btn" onclick="addHighlight(${index})">Add Highlight</button><br><br>
          <button class="join-btn" onclick="joinGame(${index})">Join</button>
          <button class="join-btn" style="background:#f77;" onclick="editGame(${index})">Edit</button>
          <button class="join-btn" style="background:#c92f3f;" onclick="deleteGame(${index})">Delete</button>
        `;
        gameList.appendChild(div);
      });
    }

    // Join game
    function joinGame(index) {
      const name = prompt("Enter your first name:");
      if (!name) return;
      const email = prompt("Enter your email:");
      if (!email) return;

      if (!games[index].attendees) games[index].attendees = [];
      games[index].attendees.push({ name, email: email.trim().toLowerCase() });
      localStorage.setItem("games", JSON.stringify(games));
      renderGames();
    }

    // Add highlight
    function addHighlight(index) {
      const name = prompt("Enter your first name:");
      if (!name) return;
      const email = prompt("Enter your email:");
      if (!email) return;

      const game = games[index];
      const inputEmail = email.trim().toLowerCase();
      const creatorEmail = game.creator?.email?.trim().toLowerCase();

      const isAttendee = game.attendees.some(a => a.email === inputEmail);
      if (!isAttendee && inputEmail !== creatorEmail && inputEmail !== adminEmail) {
        alert("Only attendees or the creator/admin can add highlights.");
        return;
      }

      const text = document.getElementById(`highlightText${index}`).value.trim();
      const fileInput = document.getElementById(`highlightImage${index}`);
      const file = fileInput.files[0];

      const addAndSave = (imageData) => {
        if (!Array.isArray(game.highlights)) game.highlights = [];
        game.highlights.push({
          name,
          text: text || "",
          image: imageData || null,
          video: (text && text.startsWith("http")) ? text : null
        });
        localStorage.setItem("games", JSON.stringify(games));
        document.getElementById(`highlightText${index}`).value = "";
        fileInput.value = "";
        renderGames();
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = () => addAndSave(reader.result);
        reader.readAsDataURL(file);
      } else {
        addAndSave(null);
      }
    }

    // Placeholder edit and delete
    function editGame(index) { alert("Edit game feature not yet implemented."); }
    function deleteGame(index) {
      if (!confirm("Delete this game?")) return;
      games.splice(index, 1);
      localStorage.setItem("games", JSON.stringify(games));
      renderGames();
    }

    renderGames();
  </script>
</body>
</html>
