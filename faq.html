<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a href="rules.html">Rules</a>
  <a href="world-championship.html">World Championship</a>
  <a href="register.html">Register</a>
  <a href="faq.html">Game Hub</a>
  <a href="blog.html">Blog</a>
  <a href="media.html">Media</a>
</nav>
  
 <h1 class="glow-title">GAME HUB</h1>
  
  <!-- Post a Game Form -->
  <section class="card">
    <h2>Host a Game</h2>
    <form id="gameForm">
      <input type="text" id="location" placeholder="Location (e.g., Dallas, TX)" required />
      <input type="date" id="date" required />
      <input type="time" id="time" required />
      <textarea id="details" placeholder="Extra details (optional)"></textarea>
      <button type="submit">Post Game</button>
    </form>
  </section>

  <!-- Event Listings -->
  <section class="card">
    <h2>Upcoming Games</h2>
    <div id="gameList"></div>
  </section>

  <!-- Highlights -->
  <section class="card">
    <h2>Game Highlights</h2>
    <form id="highlightForm">
      <textarea id="highlightText" placeholder="Share your summary, photos, or video link"></textarea>
      <button type="submit">Post Highlight</button>
    </form>
    <div id="highlightList"></div>
  </section>
</main>
     
<footer>
  <p class="site-tagline">The nation's finest resource for all things four square.</p>
</footer>
<script>
  // LocalStorage-based event system
  const gameForm = document.getElementById("gameForm");
  const gameList = document.getElementById("gameList");
  const highlightForm = document.getElementById("highlightForm");
  const highlightList = document.getElementById("highlightList");

  let games = JSON.parse(localStorage.getItem("games")) || [];
  let highlights = JSON.parse(localStorage.getItem("highlights")) || [];

  // Render games
  function renderGames() {
    gameList.innerHTML = "";
    games.forEach((game, index) => {
      // Convert time to 12-hour format
      let [hour, minute] = game.time.split(":");
      hour = parseInt(hour);
      let ampm = hour >= 12 ? "PM" : "AM";
      hour = hour % 12 || 12; // converts 0 to 12 for midnight
      let formattedTime = hour + ":" + minute + " " + ampm;

      // Convert date to Month Day, Year
      let dateObj = new Date(game.date);
      let options = { year: 'numeric', month: 'long', day: 'numeric' };
      let formattedDate = dateObj.toLocaleDateString(undefined, options);

      // Build attendees list
      let attendeeList = "";
      if (game.attendees.length > 0) {
        attendeeList = "<ul>" + game.attendees.map(a => `<li>${a.name} (${a.email})</li>`).join("") + "</ul>";
      } else {
        attendeeList = "<p>No one joined yet</p>";
      }

      const div = document.createElement("div");
      div.classList.add("event");
      div.innerHTML = `
        <strong>${game.location}</strong> — ${formattedDate} at ${formattedTime}<br>
        ${game.details ? `<em>${game.details}</em><br>` : ""}
        <strong>Attendees:</strong> ${attendeeList}
        <button class="join-btn" onclick="joinGame(${index})">Join</button>
      `;
      gameList.appendChild(div);
    });
  }

  // Add game
  gameForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const newGame = {
      location: document.getElementById("location").value,
      date: document.getElementById("date").value,
      time: document.getElementById("time").value,
      details: document.getElementById("details").value,
      attendees: []  // array to store name + email objects
    };
    games.push(newGame);
    localStorage.setItem("games", JSON.stringify(games));
    gameForm.reset();
    renderGames();
  });

  // Join game
  function joinGame(index) {
    const name = prompt("Enter your first name:");
    if (!name) return;
    const email = prompt("Enter your email:");
    if (!email) return;

    games[index].attendees.push({ name, email });
    localStorage.setItem("games", JSON.stringify(games));
    renderGames();
  }

  // Render highlights
  function renderHighlights() {
    highlightList.innerHTML = "";
    highlights.forEach((text) => {
      const div = document.createElement("div");
      div.classList.add("highlight");
      div.innerText = text;
      highlightList.appendChild(div);
    });
  }

  // Add highlight
  highlightForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = document.getElementById("highlightText").value;
    if (text.trim() !== "") {
      highlights.push(text);
      localStorage.setItem("highlights", JSON.stringify(highlights));
      highlightForm.reset();
      renderHighlights();
    }
  });

  // Init
  renderGames();
  renderHighlights();
</script>
</body>
</html>
