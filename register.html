<h1 class="glow-title" style="width:100%; text-align:center; margin:0.2em 0;">
  REGISTER FOR 2026 WORLD CHAMPIONSHIP
</h1>
  
<h2 class="slogan">You Can Play Too!</h2>
  
<section class="register-intro">
  <form action="https://formspree.io/f/xyz" method="POST">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="">-- Select Gender --</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>

    <label for="age">Age</label>
    <input type="number" id="age" name="age" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="location">Where do you live?</label>
    <input type="text" id="location" name="location" required>

    <button type="submit">Register</button>
  </form>
</section>  <!-- ✅ this closes the card wrapper -->
