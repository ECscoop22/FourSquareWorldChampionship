<body>
  <nav>
    <a href="index.html">Home</a>

    <a href="world-championship.html">World Championship</a>
    <a href="register.html">Register</a>

    <a href="faq.html">FAQ</a>

  <main>
    <h1 class="glow-title" style="width:100%; text-align:center; margin:0.6em 0;">
      REGISTER FOR 2026 WORLD CHAMPIONSHIP
    </h1>

    <section class="card">
      <!-- Registration form -->
      <form action="https://formspree.io/f/xyz" method="POST" novalidate>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">-- Select Gender --</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="1" max="120" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone">

        <label for="location">Where do you live?</label>
        <input type="text" id="location" name="location" required>

        <button type="submit">Register</button>
      </form>
    </section>

    <!-- optional small note -->
    <p style="text-align:center; margin-top:1.5em;">Placeholder text</p>

  </main>

  <footer style="text-align:center; padding: 2em 1em;">
    <div class="site-tagline">The nation's finest resource for all things four square.</div>
  </footer>
</body>
